<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="送迎ルート管理">
 <link rel="apple-touch-icon" href="icon-180.png"> 
<title>送迎ルート管理</title>

<style>
*{box-sizing:border-box}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",sans-serif;
  margin:0;
  background:#f5f5f7;
  color:#111
}

header{
  position:sticky;
  top:0;
  background:#fff;
  padding:12px 16px;
  text-align:center;
  border-bottom:1px solid #ddd;
  z-index:10
}

.headerTitle{
  font-size:21px;
  font-weight:800
}

.headerSub{
  font-size:12px;
  color:#666;
  margin-top:4px
}

nav{
  display:flex;
  overflow-x:auto;
  gap:7px;
  padding:9px;
  background:#fff;
  border-bottom:1px solid #ddd
}

nav button{
  white-space:nowrap;
  border:0;
  border-radius:11px;
  padding:10px 12px;
  background:#ececee;
  font-weight:700
}

nav button.active{
  background:#111;
  color:#fff
}

main{
  max-width:900px;
  margin:auto;
  padding:12px
}

.page{
  display:none
}

.page.active{
  display:block
}

.card{
  background:#fff;
  border-radius:16px;
  padding:14px;
  margin-bottom:12px;
  box-shadow:0 1px 5px rgba(0,0,0,.07)
}

.row{
  display:grid;
  grid-template-columns:46px 1fr;
  gap:9px;
  align-items:start;
  padding:10px 0;
  border-bottom:1px solid #eee
}

.check{
  width:38px;
  height:38px;
  border-radius:10px;
  border:2px solid #999;
  background:#fff;
  font-size:22px
}

.check.on{
  background:#111;
  color:#fff;
  border-color:#111
}

input,select{
  width:100%;
  padding:10px;
  border:1px solid #ccc;
  border-radius:10px;
  font-size:16px;
  margin:3px 0
}

.btn{
  width:100%;
  padding:14px;
  border:0;
  border-radius:13px;
  background:#111;
  color:#fff;
  font-size:17px;
  font-weight:800;
  margin-top:8px
}

.btn2{
  width:100%;
  padding:12px;
  border:0;
  border-radius:13px;
  background:#e8e8eb;
  color:#111;
  font-size:16px;
  font-weight:700;
  margin-top:8px
}

.route{
  background:#f7f7f8;
  border-left:4px solid #111;
  border-radius:9px;
  padding:10px;
  margin:7px 0
}

.link{
  display:block;
  padding:12px;
  border-radius:11px;
  background:#eaf1ff;
  color:#124cad;
  text-decoration:none;
  font-weight:700;
  margin-top:8px
}

.small{
  font-size:13px;
  color:#666
}

.notice{
  padding:10px;
  background:#fff7d6;
  border-radius:10px;
  margin-bottom:10px;
  font-size:14px
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px
}

.badge{
  display:inline-block;
  background:#eee;
  border-radius:999px;
  padding:4px 8px;
  font-size:12px
}

.topline{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px
}

.loginWrap{
  max-width:520px;
  margin:40px auto;
  padding:12px
}

.loginTitle{
  text-align:center;
  font-size:24px;
  font-weight:800;
  margin-bottom:14px
}

.readonlyBox{
  padding:10px 0;
  border-bottom:1px solid #eee
}

#appShell{
  display:none
}

#loginShell{
  display:none
}

@media(max-width:700px){

  .desktopOnly{
    display:none!important
  }

  main{
    padding:9px
  }

  .card{
    border-radius:13px;
    padding:12px
  }
}
</style>
</head>

<script type="module">

import {
initializeApp
}

import {

}

import {
getFirestore,
doc,
getDoc,
setDoc,
onSnapshot,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";


const firebaseConfig = {

apiKey:
"AIzaSyDZcdCaMwmzNRdU9g4E7S48A84Q8XFHwY8",

authDomain:
"sougei-route-e0642.firebaseapp.com",

projectId:
"sougei-route-e0642",

storageBucket:
"sougei-route-e0642.firebasestorage.app",

messagingSenderId:
"509326252851",

appId:
"1:509326252851:web:3701fb2c066ed2dda3bc46"

};


const firebaseApp =
initializeApp(firebaseConfig);


const auth =
getAuth(firebaseApp);


const db =
getFirestore(firebaseApp);


const sharedRef =
doc(
db,
"shared",
"appData"
);
const usersRef = doc(
  db,
  "shared",
  "users"
);
 async function saveUsersToCloud(){
  if(!auth.currentUser) return;

  try{
    await setDoc(
      usersRef,
      {
        users: data.users,
        updatedAt: serverTimestamp()
      },
      { merge:true }
    );

    setStatus("利用者名簿を共有保存しました");
  }catch(err){
    console.error(err);
    setStatus("利用者名簿の保存エラー");
  }
} 
window.saveUsersToCloud = saveUsersToCloud;
const LOCAL_KEY =
"shuttleCompleteV3";


const INITIAL_DATA = {

facility:{

address:
"横浜市青葉区荏田西2-29-24 2階",

lat:
35.5537255,

lon:
139.552457,

carCount:
2

},

users:[],

staff:
Array.from(
{length:10},
(_,i)=>({

name:
`職員${i+1}`,

car:
`車${(i%3)+1}`,

gmail:"",

active:false

})
),

routes:[]

};


function clone(v){

return JSON.parse(
JSON.stringify(v)
);

}


function normalize(v){

const x =
(v && typeof v==="object")
?
v
:
{};


return {

facility:{
...INITIAL_DATA.facility,
...(x.facility||{})
},

users:
Array.isArray(x.users)
?
x.users
:
[],

staff:
Array.isArray(x.staff)
&&
x.staff.length
?
x.staff
:
clone(INITIAL_DATA.staff),

routes:
Array.isArray(x.routes)
?
x.routes
:
[]

};

}


let data;


try{

const saved =
localStorage.getItem(
LOCAL_KEY
);

data =
saved
?
normalize(
JSON.parse(saved)
)
:
clone(INITIAL_DATA);

}
catch(e){

data =
clone(INITIAL_DATA);

}


window.data =
data;


let cloudReady =
false;

let applyingRemote =
false;

let saveTimer =
null;

let unsubscribeCloud =
null;


function setStatus(text){

document.getElementById(
"syncStatus"
).textContent =
text;

}


function localBackup(){

localStorage.setItem(
LOCAL_KEY,
JSON.stringify(data)
);

}


function save(){
  localBackup();
}

window.save =
save;


function isMobileView(){

return window.matchMedia(
"(max-width:700px)"
).matches;

}


function esc(s){

return String(
s??""
).replace(
/[&<>"']/g,
m=>({

"&":"&amp;",

"<":"&lt;",

">":"&gt;",

"\"":"&quot;",

"'":"&#039;"

}[m])
);

}


function showPage(id){

document
.querySelectorAll(
"nav button"
)
.forEach(
b=>
b.classList.toggle(
"active",
b.dataset.page===id
)
);


document
.querySelectorAll(
".page"
)
.forEach(
p=>
p.classList.toggle(
"active",
p.id===id
)
);


render();

}


document
.querySelectorAll(
"nav button"
)
.forEach(
b=>
b.onclick=
()=>showPage(
b.dataset.page
)
);


function countSelected(){

return data.users.filter(
u=>u.active
).length;

}


window.toggleUser =
function(i){

if(
!data.users[i].active
&&
countSelected()>=10
){

alert(
"本日の利用者は最大10名までです。"
);

return;

}


data.users[i].active =
!data.users[i].active;


save();

renderToday();

};


function renderToday(){

document.getElementById(
"countBadge"
).textContent =
`${countSelected()} / 10名`;


const el =
document.getElementById(
"todayList"
);


if(
!data.users.length
){

el.innerHTML =
'<p class="small">利用者名簿がまだありません。パソコンの「利用者名簿」から登録してください。</p>';

return;

}


el.innerHTML =
data.users.map(
(u,i)=>`

<div class="row">

<button
class="check ${u.active?"on":""}"
onclick="toggleUser(${i})">

${u.active?"✓":"□"}

</button>

<div>

<b>
${esc(u.name)}
</b>

<br>

<span class="small">
${esc(u.address)}
</span>

</div>

</div>

`
).join("");

}


function dist(a,b){

return Math.hypot(

Number(a.lat)
-
Number(b.lat),

Number(a.lon)
-
Number(b.lon)

);

}


function buildRoutes(){

const chosen =
data.users.filter(
u=>
u.active
&&
u.name
&&
u.address
&&
u.lat!==""
&&
u.lon!==""
);


if(
!chosen.length
){

alert(
"本日の利用者を選択してください。"
);

return;

}


const n =
Math.max(
1,
Math.min(
3,
Number(
data.facility.carCount
)
||
1
)
);


const cars =
Array.from(
{length:n},
()=>[]
);


chosen.forEach(
(u,i)=>
cars[i%n].push(u)
);


data.routes =
cars.map(
(list,idx)=>{

let remain =
[...list];

let ordered =
[];

let cur = {

lat:
data.facility.lat,

lon:
data.facility.lon

};


while(
remain.length
){

let best =
0;


for(
let i=1;
i<remain.length;
i++
){

if(
dist(
cur,
remain[i]
)
<
dist(
cur,
remain[best]
)
)
best=i;

}


const u =
remain.splice(
best,
1
)[0];


ordered.push(u);

cur=u;

}


return {

car:
`車${idx+1}`,

users:
ordered

};

}
);


save();

showPage(
"route"
);

}


document.getElementById(
"buildBtn"
).onclick =
buildRoutes;


document.getElementById(
"clearBtn"
).onclick =
()=>{

data.users.forEach(
u=>u.active=false
);

data.routes=[];

save();

render();

};


function mapUrl(
route,
reverse=false
){

const f =
data.facility;


const arr =
reverse
?
[...route.users].reverse()
:
route.users;


const wp =
arr.map(
u=>
encodeURIComponent(
u.address
)
).join(
"%7C"
);


return`https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(f.address)}&destination=${encodeURIComponent(f.address)}&waypoints=${wp}&travelmode=driving`;

}

const el =
document.getElementById(
"routeView"
);


if(

){

el.innerHTML =
'<p class="small">まだルートがありません。</p>';

}


el.innerHTML =

<h3>
${r.car}
</h3>

<b>

</b>

<div class="route">

</div>

${

}

<div class="route">

</a>

<br>

<b>
送り：施設 → 利用者 → 施設
</b>

<div class="route">
出発　施設
</div>

${

[...r.users]
.reverse()
.map(
(u,i)=>`

<div class="route">

${i+1}　
${esc(u.name)}

<br>

<span class="small">
${esc(u.address)}
</span>

</div>

`
).join("")

}

<div class="route">
到着　施設
</div>

<a
class="link"

href="${mapUrl(r,true)}">

送り Googleマップを開く

</a>

</div>

`
).join("");

}


window.toggleStaff =
function(i){

data.staff[i].active =
!data.staff[i].active;

save();

renderStaff();

renderSend();

};

document.getElementById(
"staffList"

<button
class="check ${s.active?"on":""}"

${s.active?"✓":"□"}

</select>

</div>

</div>

window.renderSend =
renderSend;


function composeUrl(
staff,
route
){

const subject =
`本日の送迎ルート ${staff.car} 担当：${staff.name}`;


const lines = [

`${staff.name}さん`,

"",

`本日の担当車：${staff.car}`,

"",

"【迎え】",

`出発：${data.facility.address}`,

...route.users.map(
(u,i)=>
`${i+1}. ${u.name} ${u.address}`
),

`到着：${data.facility.address}`,

"",

`迎えGoogleマップ：${mapUrl(route,false)}`,

"",

"【送り】",

`出発：${data.facility.address}`,

...[...route.users]
.reverse()
.map(
(u,i)=>
`${i+1}. ${u.name} ${u.address}`
),

`到着：${data.facility.address}`,

"",

`送りGoogleマップ：${mapUrl(route,true)}`

];


return
`https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(staff.gmail)}&su=${encodeURIComponent(subject)}&body=${encodeURIComponent(lines.join("\n"))}`;

}

){

return

<div class="card">

<h3>
${esc(s.name)} / ${esc(s.car)}
</h3>

${

r.users.map(
(u,i)=>`

<div class="route">

${i+1}.
${esc(u.name)}

<br>

<span class="small">
${esc(u.address)}
</span>

</div>

}

<a
class="link"
target="_blank"
href="${mapUrl(r,false)}">

迎え Googleマップ

</a>

<a
class="link"
target="_blank"
href="${mapUrl(r,true)}">

送り Googleマップ

</a>

<a
class="link"
target="_blank"
href="${composeUrl(s,r)}">

Gmail作成

</a>

</div>

`;

}
).join("");

}


function renderMaster(){

const mobile =
isMobileView();


const notice =
document.getElementById(

);


notice.textContent =
mobile
?
"スマホでは利用者名簿は閲覧専用です。追加・修正・削除はパソコンで行ってください。"

"利用者名簿の変更はFirebaseに共有保存され、ログイン中のスマホにも反映されます。";


const el =
document.getElementById(
"masterList"
);


if(

){

el.innerHTML =
'<p class="small">まだ利用者が登録されていません。「利用者を追加」から登録できます。</p>';

}


if(
mobile

async function startCloudSync(){

setStatus(
"共有データ確認中…"
);


try{

const snap =
await getDoc(
sharedRef
);


if(
snap.exists()
&&
snap.data().payload
){

data =
normalize(
snap.data().payload
);

window.data =
data;

localBackup();

}
else{

await setDoc(

sharedRef,

{

payload:data,

updatedAt:
serverTimestamp(),

updatedBy:
auth.currentUser.uid

},

{
merge:true
}

);

}


render();


cloudReady =
true;


setStatus(
"共有接続済み"
);


if(
unsubscribeCloud
)
unsubscribeCloud();


unsubscribeCloud =
onSnapshot(

sharedRef,

s=>{

const remote =
s.data()?.payload;


if(
!remote
)
return;


const normalized =
normalize(
remote
);


if(
JSON.stringify(
normalized
)
===
JSON.stringify(
data
)
)
return;


applyingRemote =
true;


data =
normalized;


window.data =
data;


localBackup();


render();


applyingRemote =
false;


setStatus(
"共有データ更新"
);


setTimeout(
()=>setStatus(
"共有接続済み"
),
1200
);

},

err=>{

console.error(err);

setStatus(
"共有接続エラー"
);

}

);
onSnapshot(
  usersRef,
  (snap) => {
    const remoteUsers = snap.data()?.users;

    if (!Array.isArray(remoteUsers)) return;

    data.users = remoteUsers;
    window.data = data;

    localBackup();

    renderToday();
    renderMaster();

    setStatus("利用者名簿を共有同期しました");
  },
  (err) => {
    console.error(err);
    setStatus("利用者名簿の同期エラー");
  }
);
}
catch(err){

console.error(err);

setStatus(
"共有接続エラー"
);


alert(
"Firestoreに接続できませんでした。Firebaseの設定を確認してください。"
);

}

}


function authMessage(code){

const map = {

"auth/invalid-credential":
"メールアドレスまたはパスワードが違います。",

"auth/invalid-email":
"メールアドレスの形式を確認してください。",

"auth/too-many-requests":
"ログイン試行が多すぎます。少し時間をおいてください。",

"auth/unauthorized-domain":
"このGitHub PagesのドメインがFirebaseで許可されていません。FirebaseのAuthentication設定で承認済みドメインに追加してください。"

};


return
map[code]
||
"ログインできませんでした。入力内容とFirebase設定を確認してください。";

}
