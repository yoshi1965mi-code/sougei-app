<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>送迎ルート管理</title>
<style>
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",sans-serif;margin:0;background:#f5f5f7;color:#111}
header{position:sticky;top:0;background:#fff;padding:16px;text-align:center;font-size:21px;font-weight:800;border-bottom:1px solid #ddd;z-index:10}
nav{display:flex;overflow-x:auto;gap:7px;padding:9px;background:#fff;border-bottom:1px solid #ddd}
nav button{white-space:nowrap;border:0;border-radius:11px;padding:10px 12px;background:#ececee;font-weight:700}
nav button.active{background:#111;color:#fff}
main{max-width:900px;margin:auto;padding:12px}
.page{display:none}.page.active{display:block}
.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 5px rgba(0,0,0,.07)}
.row{display:grid;grid-template-columns:46px 1fr;gap:9px;align-items:start;padding:10px 0;border-bottom:1px solid #eee}
.check{width:38px;height:38px;border-radius:10px;border:2px solid #999;background:#fff;font-size:22px}
.check.on{background:#111;color:#fff;border-color:#111}
input,select{width:100%;padding:10px;border:1px solid #ccc;border-radius:10px;font-size:16px;margin:3px 0}
.btn{width:100%;padding:14px;border:0;border-radius:13px;background:#111;color:#fff;font-size:17px;font-weight:800;margin-top:8px}
.btn2{width:100%;padding:12px;border:0;border-radius:13px;background:#e8e8eb;color:#111;font-size:16px;font-weight:700;margin-top:8px}
.route{background:#f7f7f8;border-left:4px solid #111;border-radius:9px;padding:10px;margin:7px 0}
.link{display:block;padding:12px;border-radius:11px;background:#eaf1ff;color:#124cad;text-decoration:none;font-weight:700;margin-top:8px}
.small{font-size:13px;color:#666}
.notice{padding:10px;background:#fff7d6;border-radius:10px;margin-bottom:10px;font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.badge{display:inline-block;background:#eee;border-radius:999px;padding:4px 8px;font-size:12px}
.topline{display:flex;justify-content:space-between;align-items:center}
</style>
</head>

<body>

<header>送迎ルート管理</header>

<nav>
<button class="active" data-page="today">本日の利用者</button>
<button data-page="route">送迎ルート</button>
<button data-page="staff">職員担当</button>
<button data-page="send">転送・Gmail</button>
<button data-page="master">利用者名簿</button>
<button data-page="settings">設定</button>
</nav>

<main>

<section id="today" class="page active">
<div class="card">

<div class="topline">
<h2>本日の利用者</h2>
<span id="countBadge" class="badge">0 / 10名</span>
</div>

<div class="notice">
利用する方をタップして ✓ にします。1日最大10名です。
</div>

<div id="todayList"></div>

<button class="btn" id="buildBtn">
送迎ルート一括更新
</button>

<button class="btn2" id="clearBtn">
本日の選択を全解除
</button>

</div>
</section>


<section id="route" class="page">
<div class="card">
<h2>送迎ルート</h2>
<div id="routeView"></div>
</div>
</section>


<section id="staff" class="page">
<div class="card">

<h2>職員担当</h2>

<div class="notice">
担当する職員を ✓ にし、担当車とGmailアドレスを設定します。
</div>

<div id="staffList"></div>

</div>
</section>


<section id="send" class="page">
<div class="card">

<h2>転送・Gmail</h2>

<div id="sendList"></div>

</div>
</section>


<section id="master" class="page">
<div class="card">

<h2>利用者名簿</h2>

<div class="notice">
利用者の名前・住所・緯度・経度を変更できます。
最大30名まで登録できます。
</div>

<button class="btn" id="addUserBtn">
利用者を追加
</button>

<div class="small" style="margin-top:8px;">
利用者名簿は最大30名まで登録できます。
</div>

</div>
</section>


<section id="settings" class="page">
<div class="card">

<h2>設定</h2>

<label>施設住所</label>
<input id="facilityAddress">

<div class="grid2">

   文字変換
================================ */

function esc(s){

return String(s ?? "")
.replace(
/[&<>"']/g,
m => ({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[m])
);

}

)

.querySelectorAll("nav button")
.forEach(
b =>
b.onclick =

/* ===============================
   距離計算
================================ */

function dist(a,b){

return Math.hypot(

Number(a.lat) -
Number(b.lat),

Number(a.lon) -
Number(b.lon)

);

}


/* ===============================
   ルート作成
================================ */

function buildRoutes(){

const chosen =
data.users.filter(
u =>
u.active &&
u.name &&
u.address &&
u.lat !== "" &&
u.lon !== ""
);


if(!chosen.length){

alert(
"本日の利用者を選択してください。"
);

return;

}


const n =
Math.max(
1,
Math.min(
3,
Number(data.facility.carCount) || 1
)
);


const cars =
Array.from(
{length:n},
() => []
);


/* 車へ振り分け */

chosen.forEach(
(u,i) => {

cars[i % n].push(u);

}
);


/* 最寄り順 */

data.routes =
cars.map(
(list,idx) => {

let remain =
[...list];

let ordered = [];

let cur = {

lat:data.facility.lat,
lon:data.facility.lon

};


while(remain.length){

let best = 0;


for(
let i=1;
i<remain.length;
i++
){

if(
dist(cur,remain[i]) <
dist(cur,remain[best])
){

best = i;

}

}


const u =
remain.splice(best,1)[0];

ordered.push(u);

cur = u;

}


return {

car:`車${idx+1}`,
users:ordered

};

}
);


save();

showPage("route");

}


/* 更新ボタン */

document
.getElementById("buildBtn")
.onclick =
buildRoutes;


/* 全解除 */

document
.getElementById("clearBtn")
.onclick =
() => {

data.users.forEach(
u => u.active = false
);

data.routes = [];

save();

render();

};


/* ===============================
   GoogleマップURL
================================ */

function mapUrl(
route,
reverse = false
){

const f =
data.facility;


const arr =
reverse
? [...route.users].reverse()
: route.users;


const wp =
arr
.map(
u =>
encodeURIComponent(
u.address
)
)
.join("%7C");


return (

"https://www.google.com/maps/dir/?api=1" +

"&origin=" +
encodeURIComponent(
f.address
) +

"&destination=" +
encodeURIComponent(
f.address
) +

"&waypoints=" +
wp +

"&travelmode=driving"

);

}

/* ===============================
   Gmail作成
================================ */

function composeUrl(
staff,
route
){

const subject =

`本日の送迎ルート ${staff.car} 担当：${staff.name}`;


const lines = [

`${staff.name}さん`,

"",

`本日の担当車：${staff.car}`,

"",

"【迎え】",

`出発：${data.facility.address}`,

...route.users.map(
(u,i) =>
`${i+1}. ${u.name} ${u.address}`
),

`到着：${data.facility.address}`,

"",

`迎えGoogleマップ：${mapUrl(route,false)}`,

"",

"【送り】",

`出発：${data.facility.address}`,

...[...route.users]
.reverse()
.map(
(u,i) =>
`${i+1}. ${u.name} ${u.address}`
),

`到着：${data.facility.address}`,

"",

`送りGoogleマップ：${mapUrl(route,true)}`

];


return (

"https://mail.google.com/mail/?view=cm&fs=1" +

"&to=" +
encodeURIComponent(
staff.gmail
) +

"&su=" +
encodeURIComponent(
subject
) +

"&body=" +
encodeURIComponent(
lines.join("\n")
)

);

}

save();

render();

};


/* ===============================
   利用者追加
================================ */

document
.getElementById(
"addUserBtn"
)
.onclick =
() => {


if(
data.users.length >= 30
){

alert(
"利用者名簿は最大30名までです。"
);

return;

}


data.users.push({

name:"",
address:"",
lat:"",
lon:"",
active:false

});


save();

renderMaster();

alert(
"新しい利用者欄を追加しました。"
);

};


/* ===============================
   設定
================================ */

function renderSettings(){

facilityAddress.value =
data.facility.address;

facilityLat.value =
data.facility.lat;

facilityLon.value =
data.facility.lon;

carCount.value =
data.facility.carCount;

}


document
.getElementById(
"saveSettingsBtn"
)
.onclick =
() => {


data.facility.address =
facilityAddress.value.trim();


data.facility.lat =
Number(
facilityLat.value
);


data.facility.lon =
Number(
facilityLon.value
);


data.facility.carCount =
Number(
carCount.value
);


save();

alert(
"設定を保存しました。"
);

};


/* ===============================
   全画面更新
================================ */

function render(){

renderToday();

renderRoutes();

renderStaff();

renderSend();

renderMaster();

renderSettings();

}


/* アプリ起動 */

render();

</script>
